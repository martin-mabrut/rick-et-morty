name: ci
run-name: ${{ github.actor }} et Najim font un workflow trop cool de ouf peut être pitié !
on: [push]
jobs:
  build:
    name: Lint Test Build
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v6

    - name: Installer Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'

    - uses: actions/cache@v6
      id: cache-npm
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Regarder la clé
      run: echo "${{ runner.os }}-modules-node20-${{ hashFiles('package-lock.json') }}"

    - name: Vérifier la clé du fichier mis en cache
      run: |
        echo "Clé du fichier actuellement mis en cache : ${{ steps.cache-npm.outputs.cache-primary-key }}"
        echo "Clé du fichier déjà mis en cache précédemment : ${{ steps.cache-npm.outputs.cache-matched-key }}"

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name:  Installer les dépendances
      run: npm ci

    - name: Lancer le lint
      run: npm run lint

    - name: Lancer les tests
      run: npm run test

    - name: Lancer le build
      run: npm run build

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          dist
    
   