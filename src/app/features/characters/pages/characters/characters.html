<section class="relative min-h-screen overflow-hidden bg-slate-950 px-6 py-20 text-white">

  <!-- Background spatial -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,#1e293b_0%,#020617_65%)]"></div>

  <!-- Glow portail -->
  <div
    class="absolute left-1/2 top-0 h-[500px] w-[500px] -translate-x-1/2 rounded-full bg-green-400/10 blur-[150px]"
  ></div>

  <!-- Contenu -->
  <div class="relative z-10 mx-auto max-w-7xl">
    <!-- Header de page -->
    <div class="mb-16 text-center">

      <span
        class="rounded-full border border-green-400/30 bg-green-400/10 px-4 py-2 text-sm uppercase tracking-[0.3em] text-green-300"
      >
        Multiverse Database
      </span>

      <h1 class="mt-6 text-5xl font-black md:text-6xl">
        Personnages du
        <span
          class="bg-gradient-to-r from-green-300 via-cyan-300 to-green-400 bg-clip-text text-transparent"
        >
          multivers
        </span>
      </h1>

      <p class="mx-auto mt-6 max-w-2xl text-lg text-slate-300">
        Découvrez les personnages et créatures rencontrées au cours des voyages interdimensionnels.
      </p>

      <app-search-bar (search)="onSearch($event)"></app-search-bar>

      <div class="mt-8 flex flex-wrap items-center justify-center gap-2">
        <app-filter-button label="Alive" value="alive" [active]="selectedStatus() === 'alive'" (select)="toggleStatus($event)"></app-filter-button>
        <app-filter-button label="Dead" value="dead" [active]="selectedStatus() === 'dead'" (select)="toggleStatus($event)"></app-filter-button>
        <app-filter-button label="Unknown" value="unknown" [active]="selectedStatus() === 'unknown'" (select)="toggleStatus($event)"></app-filter-button>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
        <app-filter-button label="Male" value="male" [active]="selectedGender() === 'male'" (select)="toggleGender($event)"></app-filter-button>
        <app-filter-button label="Female" value="female" [active]="selectedGender() === 'female'" (select)="toggleGender($event)"></app-filter-button>
        <app-filter-button label="Genderless" value="genderless" [active]="selectedGender() === 'genderless'" (select)="toggleGender($event)"></app-filter-button>
        <app-filter-button label="Unknown" value="unknown" [active]="selectedGender() === 'unknown'" (select)="toggleGender($event)"></app-filter-button>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
        <app-filter-button label="Human" value="human" [active]="selectedSpecies() === 'human'" (select)="toggleSpecies($event)"></app-filter-button>
        <app-filter-button label="Alien" value="alien" [active]="selectedSpecies() === 'alien'" (select)="toggleSpecies($event)"></app-filter-button>
        <app-filter-button label="Humanoid" value="humanoid" [active]="selectedSpecies() === 'humanoid'" (select)="toggleSpecies($event)"></app-filter-button>
        <app-filter-button label="Unknown" value="unknown" [active]="selectedSpecies() === 'unknown'" (select)="toggleSpecies($event)"></app-filter-button>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
        <app-filter-button label="Superhuman" value="superhuman" [active]="selectedType() === 'superhuman'" (select)="toggleType($event)"></app-filter-button>
        <app-filter-button label="Robot" value="robot" [active]="selectedType() === 'robot'" (select)="toggleType($event)"></app-filter-button>
        <app-filter-button label="Parasite" value="parasite" [active]="selectedType() === 'parasite'" (select)="toggleType($event)"></app-filter-button>
        <app-filter-button label="Clone" value="clone" [active]="selectedType() === 'clone'" (select)="toggleType($event)"></app-filter-button>
      </div>

    </div>

    <!-- Cards -->
    <app-pagination [currentPage]="currentPage()" [totalPages]="totalPage()" (changePage)="changePage($event)"/>
    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4">
      @for(character of characters(); track character.id) {

      <app-character-card [character]="character" />

      }
    </div>
  </div>
</section>
